<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon-32x32.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
  <link rel="manifest" href="/manifest.webmanifest" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
  
  <!-- PWA Web App Meta -->
  <meta name="mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="NOMA" />
  <meta name="application-name" content="NOMA" />
  <meta name="theme-color" content="#12203D" />

  <!-- Primary SEO Meta Tags -->
  <title>NOMA | Nigeria's Ultimate Online Shopping Marketplace</title>
  <meta name="title" content="NOMA | Nigeria's Ultimate Online Shopping Marketplace" />
  <meta name="description"
    content="Shop top-quality Fashion, Electronics, Solar Power, Groceries, Home Appliances, Bicycles, Beauty & Everyday Essentials at NOMA. Fast nationwide delivery, online checkout & instant support across Nigeria." />
  <meta name="keywords" content="NOMA, Noma Marketplace, Nigeria Ecommerce, Online Shopping Nigeria, Buy Electronics, Buy Fashion, Solar Power Inverters, Home Appliances, Fast Shipping Lagos" />
  <meta name="robots" content="index, follow" />

  <!-- Open Graph / WhatsApp / Facebook -->
  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="NOMA Marketplace" />
  <meta property="og:title" content="NOMA | Nigeria's Ultimate Online Shopping Marketplace" />
  <meta property="og:description"
    content="Shop top-quality Fashion, Electronics, Solar Power, Groceries, Appliances, Bicycles & Everyday Essentials at NOMA. Fast nationwide delivery across Nigeria." />
  <meta property="og:image" content="/pwa-512x512.png" />
  <meta property="og:locale" content="en_NG" />

  <!-- Twitter Card -->
  <meta name="twitter:card" content="summary_large_image" />
  <meta name="twitter:title" content="NOMA | Nigeria's Ultimate Online Shopping Marketplace" />
  <meta name="twitter:description"
    content="Shop top-quality Fashion, Electronics, Solar Power, Groceries, Appliances, Bicycles & Everyday Essentials at NOMA. Fast nationwide delivery across Nigeria." />
  <meta name="twitter:image" content="/pwa-512x512.png" />

  <!-- Fonts & Preconnect -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Outfit:wght@400;500;700;800;900&display=swap"
    rel="stylesheet">

  <!-- Structured JSON-LD Schema for Search Engines -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "OnlineStore",
      "name": "NOMA Marketplace",
      "url": "https://noma-africa.vercel.app",
      "logo": "https://noma-africa.vercel.app/pwa-512x512.png",
      "description": "Full-scale e-commerce marketplace for electronics, fashion, appliances, groceries, and lifestyle products.",
      "currenciesAccepted": "NGN",
      "paymentAccepted": "Bank Transfer, Pay on Delivery, Debit Card",
      "priceRange": "₦₦"
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
